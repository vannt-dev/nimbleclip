name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Semantic vX.Y.Z tag to create and release
        required: true
        type: string
      ref:
        description: Commit SHA to release
        required: true
        type: string
    secrets:
      CORE_DEPLOY_KEY:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked] "Create release tag when needed" pushes with these credentials
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/fetch-core
        with:
          deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}

      - name: Validate tag, version, and release notes
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must use vX.Y.Z."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          pubspec_version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          if [ "$version" != "$pubspec_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match pubspec.yaml version $pubspec_version."
            exit 1
          fi

          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no [$version] release notes."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: ./.github/actions/install-ndk
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing required Android signing secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

      # When CI calls this workflow, every check below has just passed on this very commit.
      # The tag and manual paths still run them.
      - name: Run release checks
        if: ${{ !inputs.ref }}
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test test lib/services/extractors/test
          node --check server.js
          node --check tool/fixture_server.js
          node --check tool/summarize_live_extractors.js
          node --test test/server_test.js test/live_extractor_summary_test.js

      - name: Build Android and Web releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Obfuscated: the names in the shipped Dart code are replaced, which
          # makes the APK harder to read back. The symbol files stay on the
          # runner: an artifact of a public repository can be downloaded by
          # anyone, and with the APK they undo the obfuscation.
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-name="$VERSION" --build-number="${{ github.run_number }}"
          flutter build web --release --no-wasm-dry-run --build-name="$VERSION" --build-number="${{ github.run_number }}"

      - name: Verify signing and package artifacts
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          cert=$($apksigner verify --print-certs "$apk" | grep -i 'certificate DN' || true)
          if [ -z "$cert" ] || printf '%s' "$cert" | grep -qi 'CN=Android Debug'; then
            echo "::error::The release APK is missing a valid non-debug signature."
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/nimbleclip-$TAG-android.apk"
          (cd build/web && zip -qr "../../dist/nimbleclip-$TAG-web.zip" .)
          (cd dist && sha256sum -- * > SHA256SUMS.txt)

      - name: Create release tag when needed
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$TAG")
            if [ "$tagged_commit" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$TAG already points to a different commit."
              exit 1
            fi
            echo "$TAG already points to this release commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "NimbleClip ${{ steps.version.outputs.version }}"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NimbleClip ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/nimbleclip-${{ steps.version.outputs.tag }}-android.apk
            dist/nimbleclip-${{ steps.version.outputs.tag }}-web.zip
            dist/SHA256SUMS.txt
