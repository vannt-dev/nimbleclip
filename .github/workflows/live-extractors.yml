name: Live extractor health

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: live-extractors
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-core
        with:
          deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: flutter pub get
      - name: Check public extractor fixtures
        id: smoke
        # The issue is the health signal. A third-party outage must not make
        # the monitoring workflow itself look broken when it reported that
        # outage successfully.
        continue-on-error: true
        run: |
          flutter test test/live_extractor_smoke_test.dart \
            --dart-define=RUN_LIVE_EXTRACTOR_TESTS=true \
            --file-reporter json:live-extractors.json
      # Which check failed, and with what, is the whole signal: a
      # `tiktokServiceStatus` means the upstream service answered non-200, while
      # a `tiktokInvalidData` carries that service's own message and so means it
      # answered and refused. Reporting only "checks failed" made six
      # consecutive days look identical.
      - name: Summarise the run
        id: summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f live-extractors.json || : > live-extractors.json
          node tool/summarize_live_extractors.js \
            live-extractors.json "$RUN_URL" --github-output
      # The summary, not the test exit code, says whether the extractors are
      # healthy: a check that the site refuses from GitHub's network fails the
      # test run and is reported, but is not a failure of ours.
      - name: Open or update health issue
        if: steps.summary.outputs.healthy == 'false'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        # Through the environment, never interpolated into the script: the
        # failure text can carry a third party's own wording.
        env:
          SUMMARY: ${{ steps.summary.outputs.markdown }}
        with:
          script: |
            const title = 'Live extractor health check is failing';
            const {data} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extractor-health'
            });
            const body = process.env.SUMMARY;
            if (data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: data[0].number,
                body
              });
            } else {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'extractor-health',
                  color: 'd73a4a',
                  description: 'Automated live extractor health failures'
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['extractor-health']
              });
            }
      # Closing on green is what makes the open issue mean something: how long
      # it has been open is how long the outage has lasted, with no counter to
      # keep. `checked` guards it — a suite that skipped every case also reports
      # success, and a run that verified nothing must not close anything.
      - name: Close the health issue once the checks pass
        if: steps.summary.outputs.healthy == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SUMMARY: ${{ steps.summary.outputs.markdown }}
        with:
          script: |
            const {data} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extractor-health'
            });
            for (const issue of data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: process.env.SUMMARY
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
