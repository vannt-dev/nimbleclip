name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-messages:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate new commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA^..$HEAD_SHA"
          fi

          failed=0
          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | tool/validate_commit_message.sh -; then
              printf 'Invalid commit subject: %s\n' "$subject" >&2
              failed=1
            fi
          done < <(git log --format=%s "$range")
          exit "$failed"

  # Decides what a pull request has to prove. Every job below still exists on
  # a pull request, so the required checks are reported; a job with nothing
  # to check is skipped, which counts as passed. A push to main runs it all.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Files the pull request changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "full run ($EVENT_NAME)"
            { echo "code=true"; echo "ios=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          # Only these leave the app as it was.
          if echo "$changed" | grep -Evq '^(docs/|[^/]+\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # The iOS build can only be checked here, and the macOS runners are
          # few: it runs when the iOS project, the plugins, the core or CI
          # change, and on every push to main before a release.
          if echo "$changed" | grep -Eq '^(ios/|pubspec\.(yaml|lock)$|lib/services/extractors$|\.github/)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  flutter-quality:
    name: Flutter quality and Web build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-core
        with:
          deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test test lib/services/extractors/test
      - run: flutter build web --release --no-wasm-dry-run

  node:
    name: Node.js server checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --check server.js
      - run: node --check tool/fixture_server.js
      - run: node --check tool/summarize_live_extractors.js
      - run: sh -n tool/check.sh tool/run_android_integration_ci.sh
      - run: node --test test/server_test.js test/live_extractor_summary_test.js

  android:
    name: Android integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-core
        with:
          deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./.github/actions/install-ndk
      - run: flutter pub get
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The action executes each YAML script line separately. Keep loops,
          # PID ownership, and traps inside one shell process.
          script: sh tool/run_android_integration_ci.sh

  ios:
    name: iOS build and Share Extension
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # connectivity_plus (via background_downloader) uses iOS 26 APIs such as
      # NWPath.isUltraConstrained, which the image's default Xcode 16.4 lacks.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-core
        with:
          deploy-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign
      - name: Verify embedded Share Extension and App Group
        run: |
          test -d "build/ios/iphoneos/Runner.app/PlugIns/Share Extension.appex"
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint "ios/Share Extension/ShareExtension.entitlements"
          grep -q 'group.com.vannt.nimbleclip' ios/Runner/Runner.entitlements
          grep -q 'group.com.vannt.nimbleclip' "ios/Share Extension/ShareExtension.entitlements"

  # What someone outside sees: this repository and nothing else. The private
  # core cannot be fetched, so no deploy key here; the public core that is part
  # of the repository is put in its place and the app has to analyse, pass the
  # public core's tests and build. A pull request from a fork runs these two
  # jobs the same way. They do not gate a release: a released build is made
  # with the full core.
  public-core:
    name: Build from the public repository alone (Android)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      # Without the Gradle cache this build took five minutes; with it, about two.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: The private core is not here
        run: test ! -e lib/services/extractors/registry.dart
      - name: Put the public core in its place
        run: dart run tool/use_public_core.dart
      - run: flutter pub get
      - name: Nothing shows up as a change
        run: test -z "$(git status --porcelain -- lib/services/extractors)"
      - name: The app's own code analyses against the public core
        run: flutter analyze lib
      - run: flutter test test/public_core_test.dart
      - uses: ./.github/actions/install-ndk
      - run: flutter build apk --debug --target-platform android-arm64

  public-core-ios:
    name: Build from the public repository alone (iOS)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # As for the ios job above.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Put the public core in its place
        run: dart run tool/use_public_core.dart
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign

  release-candidate:
    name: Detect version release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [commit-messages, flutter-quality, node, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a releasable version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if [ -z "$BEFORE_SHA" ] || printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            echo "No previous main commit is available; skipping automatic release."
            exit 0
          fi

          read_version() {
            sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p'
          }

          current_full=$(read_version < pubspec.yaml)
          previous_full=$(git show "$BEFORE_SHA:pubspec.yaml" | read_version)
          current_version=${current_full%%+*}
          previous_version=${previous_full%%+*}

          if ! printf '%s' "$current_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pubspec.yaml must use a semantic X.Y.Z release version."
            exit 1
          fi

          if [ "$current_version" != "$previous_version" ]; then
            oldest=$(printf '%s\n%s\n' "$previous_version" "$current_version" | sort -V | head -1)
            if [ "$oldest" != "$previous_version" ]; then
              echo "::error::Version must increase ($previous_version -> $current_version)."
              exit 1
            fi
          else
            echo "Version is unchanged; checking for an interrupted release."
          fi

          if ! awk -v header="## [$current_version]" '
            index($0, header) == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found && /^-[[:space:]]/ { notes = 1 }
            END { exit !(found && notes) }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$current_version] release notes."
            exit 1
          fi

          tag="v$current_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; skipping automatic release."
            exit 0
          fi

          {
            echo "should_release=true"
            echo "tag=$tag"
            echo "version=$current_version"
          } >> "$GITHUB_OUTPUT"
          echo "Release candidate detected: $tag"

  publish-release:
    name: Publish release
    needs: release-candidate
    if: needs.release-candidate.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-candidate.outputs.tag }}
      ref: ${{ github.sha }}
    secrets:
      CORE_DEPLOY_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
